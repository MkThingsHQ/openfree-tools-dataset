name: Sync OpenFree dataset

on:
  schedule:
    # 01:00 Asia/Shanghai (UTC+8), at 17:00 UTC on the previous day.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfree-dataset-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MkThingsHQ/openfree-tools-dataset' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test generator
        run: npm test
      - name: Fetch and render both languages
        env:
          OPENFREE_API_KEY: ${{ secrets.OPENFREE_API_KEY }}
        run: npm run sync
      - name: Commit changed public outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md README.zh-CN.md data/dataset.json
          if git diff --cached --quiet; then
            echo "Dataset is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(dataset): sync OpenFree catalog'
          gh auth setup-git
          git push origin HEAD:main
